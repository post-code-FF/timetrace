name: Linux release builds

on:
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  linux:
    name: Three unified Linux x86_64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build compatible private runtimes
        run: bash packaging/build_in_docker.sh
      - name: Test application and D-Bus integration
        run: |
          for libc in 2.31 2.35 2.39; do
            docker run --rm -v "$PWD:/source" -w /source "timetrace-build-glibc-$libc" bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends dbus
              uv pip install pytest pytest-qt
              PYTHONPATH=src python -m pytest -q
              PYTHONPATH=src TIMETRACE_PRIVATE_BUS_TEST=1 dbus-run-session -- python scripts/test-dbus-integration.py
              test "$(/build/packaging/dist/timetrace --version)" = "timetrace $(sed -n '\''s/^version = "\([^"]*\)"/\1/p'\'' pyproject.toml)"
            '
          done
      - name: Test shell integrations and nested Wayland compositor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs
          gjs -m tests/extension-harness.js src/timetrace/assets/gnome_extension/extension.js
          gjs tests/kwin-harness.js src/timetrace/assets/kwin_script/contents/code/main.js
          docker build -f packaging/docker/Dockerfile.wayland-test -t timetrace-wayland-test .
          docker run --rm -v "$PWD:/source" timetrace-wayland-test bash scripts/test-headless-wayland.sh
          docker run --rm -v "$PWD:/source" timetrace-wayland-test bash scripts/test-headless-wayland.sh labwc
          docker run --rm -v "$PWD:/source" timetrace-wayland-test bash scripts/test-cosmic-wire.sh
          docker run --rm -v "$PWD:/source" timetrace-wayland-test python scripts/test-x11-focus.py
          docker run --rm -v "$PWD:/source" timetrace-wayland-test python -c 'import subprocess; from timetrace.backends.session_cinnamon import SNAPSHOT_SCRIPT; subprocess.run(["gjs", "tests/cinnamon-harness.js", SNAPSHOT_SCRIPT], check=True)'
      - name: Build Debian and RPM installers
        run: |
          docker build -f packaging/docker/Dockerfile.fpm -t timetrace-fpm .
          docker run --rm -v "$PWD:/source" -w /source timetrace-fpm bash packaging/build_deb_rpm.sh
      - name: Verify packaged app tracks real Wayland clients
        run: |
          docker run --rm -v "$PWD:/source" -e TIMETRACE_FROZEN_BIN=/source/packaging/stage/usr/bin/timetrace timetrace-wayland-test bash scripts/test-headless-wayland.sh
          docker run --rm -v "$PWD:/source" -e TIMETRACE_TEST_QPA=wayland -e TIMETRACE_FROZEN_BIN=/source/packaging/stage/usr/bin/timetrace timetrace-wayland-test bash scripts/test-headless-wayland.sh labwc
      - name: Build Arch installer
        run: bash packaging/build_arch.sh
      - name: Check package installation and GUI startup
        run: bash packaging/test_packages.sh
      - name: Check upgrades restart running user instances
        run: bash packaging/test_upgrades.sh
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp packaging/out/*.deb packaging/out/*.rpm packaging/out/*.pkg.tar.zst release-assets/
          (cd release-assets && sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timetrace-linux-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
